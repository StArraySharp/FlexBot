# 手动触发的发布打包
#
# 用法：仓库 → Actions → 「发布打包」 → Run workflow → 填版本号 → 运行
# 产物：5 个平台自包含包（win64 / linux x64 / linux arm64 / macos x64 / macos arm64）
#      + FlexBot_BuiltInPlugins.zip（平台无关，条目带 plugins/ 前缀，WebUI「添加插件」可一次装多个）
# 同时可作为 workflow 产物下载；勾选 create_release 时还会建一个 v<版本> 的 Release 并附上这些 zip。
name: 发布打包

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（用于产物文件名与输出目录）
        required: true
        default: "1.0.0"
        type: string
      create_release:
        description: 同时创建 GitHub Release 并上传产物（已存在同名 Release 则覆盖附件）
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      OUT_DIR: publish/release/${{ inputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 打包（宿主 5 个平台 + 内置插件包）
        # 用 bash 显式调用：仓库在 Windows 上提交时可能没带上可执行位
        run: bash release.sh "$VERSION" "$OUT_DIR"

      - name: 列出产物
        run: ls -lh "$OUT_DIR"

      - name: 上传为 workflow 产物
        uses: actions/upload-artifact@v4
        with:
          name: FlexBot-${{ inputs.version }}
          path: ${{ env.OUT_DIR }}/*.zip
          if-no-files-found: error

      - name: 创建或更新 Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION 已存在，覆盖附件"
            gh release upload "v$VERSION" "$OUT_DIR"/*.zip --clobber
          else
            gh release create "v$VERSION" --title "FlexBot $VERSION" --generate-notes "$OUT_DIR"/*.zip
          fi
          gh release view "v$VERSION" --json url,tagName,assets
